name: Publicar site estático no GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "public/**"
      - "app/**"
      - "server.py"
      - "tools/**"
      - ".github/workflows/pages.yml"
  schedule:
    # 6x ao dia (a cada 4h) — mantém o snapshot de previsões atualizado
    - cron: "17 0,4,8,12,16,20 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Gerar snapshot estático (agrega fontes + YouTube + ao vivo)
        run: |
          python - <<'PY'
          import json, pathlib, time, subprocess, sys
          # Re-tenta o build até o Windrawwin responder (ele aplica rate-limit
          # por IP a acessos em rajada; o primeiro deploy do dia funcionou).
          ok = False
          for attempt in range(4):
              subprocess.run([sys.executable, "tools/build_static.py", "site"], check=True)
              html = pathlib.Path("site/index.html").read_text(encoding="utf-8")
              start = html.index("window.__SNAPSHOT__ = ") + len("window.__SNAPSHOT__ = ")
              end = html.index("</script>", start)
              snap = json.loads(html[start:end].rstrip().rstrip(";"))
              ww = (snap.get("predictions") or {}).get("sources", {}).get("windrawwin", {})
              status = ww.get("status", "error")
              print(f"tentativa {attempt + 1}: windrawwin={status}")
              if status == "ok":
                  ok = True
                  break
              time.sleep(45)
          if not ok:
              print("Aviso: Windrawwin indisponível após retries — publicando com as demais fontes.")
          PY

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artefato
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
